name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  ship:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: ubuntu-latest
            target: linux-aarch64
            cross: aarch64
          - os: macos-latest
            target: macos-arm64
          - os: macos-latest
            target: macos-x64
            xarch: x86_64
          - os: windows-latest
            target: windows-x64
            exe: .exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.4'
      - name: install aarch64 toolchain (linux cross)
        if: matrix.cross == 'aarch64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: build linux-aarch64
        if: matrix.cross == 'aarch64'
        run: >
          nim c -d:release --mm:orc --cpu:arm64 --os:linux
          --gcc.exe=aarch64-linux-gnu-gcc --gcc.linker=aarch64-linux-gnu-gcc
          -o:necropsy-linux-aarch64 src/necropsy.nim
      - name: build macos-x64 (cross from arm64 runner)
        if: matrix.xarch == 'x86_64'
        run: >
          nim c -d:release --mm:orc --cpu:amd64 --os:macosx64 --cc:clang
          --clang.exe="clang" --clang.linkerexe="clang"
          --passC:"-arch x86_64" --passL:"-arch x86_64"
          -o:necropsy-macos-x64 src/necropsy.nim
      - name: build native
        if: matrix.cross != 'aarch64' && matrix.xarch != 'x86_64'
        shell: bash
        run: nim c -d:release --mm:orc -o:"necropsy-${{ matrix.target }}${{ matrix.exe }}" src/necropsy.nim
      - name: smoke
        shell: bash
        run: ./necropsy-${{ matrix.target }}${{ matrix.exe }} version
      - uses: actions/upload-artifact@v4
        with:
          name: necropsy-${{ matrix.target }}
          path: necropsy-${{ matrix.target }}*

  publish:
    needs: ship
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: checksums
        run: |
          cd dist
          sha256sum necropsy-* > SHA256SUMS
          ls -la
      - name: release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/necropsy-*
            dist/SHA256SUMS
